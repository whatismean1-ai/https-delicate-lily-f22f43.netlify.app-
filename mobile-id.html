<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css?v=999" />
  <title>주민등록증 모바일 확인 서비스</title>
</head>
<body>
  <div class="stage">
    <main class="phone" aria-label="주민등록증 모바일 확인 서비스">

      <!-- 상단 알림 -->
      <div class="notice-top" role="note" aria-label="공식 누리집 안내">
        <img
          src="./assets/flag_24x16.png"
          srcset="./assets/flag_48x32@2x.png 2x"
          width="24"
          height="16"
          alt=""
          aria-hidden="true"
        />
        <p class="notice-msg">이 누리집은 대한민국 공식 전자정부 누리집입니다.</p>
      </div>

      <!-- 헤더 -->
      <header class="topbar">
        <a class="brand" href="./menu.html" aria-label="뒤로가기">
          <span class="menu-text">뒤로</span>
        </a>

        <div class="menu-text">주민등록증 모바일 확인 서비스</div>
      </header>

      <div class="sep-inset" aria-hidden="true"></div>

      <section class="section" aria-label="서비스 설명">
        <h2 class="section-title">주민등록증 모바일 확인 서비스</h2>

        <div class="footer-box">
          <div class="f-row">
            <div class="f-title">서비스 안내</div>
            <div class="f-text">
              주민등록증을 대신해<br />
              본인 확인을 지원하는 서비스입니다.
            </div>
          </div>
        </div>
      </section>

      <section class="section" aria-label="이용 전 확인사항">
        <div class="footer-box">
          <div class="f-row">
            <div class="f-title">이용 전 확인사항</div>
            <div class="f-text">
              본인 명의 휴대전화 필요<br />
              정부24 로그인 필요<br />
              서비스 이용 시 네트워크 연결 필요
            </div>
          </div>
        </div>
      </section>

      <section class="section" aria-label="동의">
        <div class="footer-box">
          <label class="f-text">
            <input type="checkbox" />
            위 내용을 확인했습니다.
          </label>
        </div>
      </section>

      <section class="section" aria-label="확인 버튼">
        <div class="channel-grid">
          <a class="channel-btn" href="./menu.html">취소</a>
          <a class="channel-btn" href="./mobile-id-confirm.html">확인</a>
        </div>
      </section>

    </main>
  </div>
</body>
</html>
