<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css?v=999" />
  <title>확인</title>
</head>
<body>
  <div class="stage">
    <main class="phone" aria-label="확인">

      <!-- 상단 알림 -->
      <div class="notice-top" role="note" aria-label="공식 누리집 안내">
        <img
          src="./assets/flag_24x16.png"
          srcset="./assets/flag_48x32@2x.png 2x"
          width="24"
          height="16"
          alt=""
          aria-hidden="true"
        />
        <p class="notice-msg">이 누리집은 대한민국 공식 전자정부 누리집입니다.</p>
      </div>

      <!-- 헤더 -->
      <header class="topbar">
        <a class="brand" href="./mobile-id.html" aria-label="뒤로가기">
          <span class="menu-text">뒤로</span>
        </a>

        <div class="menu-text">확인</div>
      </header>

      <div class="sep-inset" aria-hidden="true"></div>

      <section class="section" aria-label="확인 완료">
        <h2 class="section-title">확인 완료</h2>

        <div class="footer-box">
          <div class="f-row">
            <div class="f-title">주민등록증 모바일 확인 서비스</div>
            <div class="f-text">
              본인 확인 정보를 표시할 수 있는 화면입니다.
            </div>
          </div>

          <div class="f-row">
            <div class="f-title">이름</div>
            <div class="f-text">홍길동</div>
          </div>

          <div class="f-row">
            <div class="f-title">생년월일</div>
            <div class="f-text">1990.01.01</div>
          </div>

          <div class="f-row">
            <div class="f-title">상태</div>
            <div class="f-text">확인 가능</div>
          </div>
        </div>
      </section>

      <section class="section" aria-label="하단 버튼">
        <div class="channel-grid">
          <a class="channel-btn" href="./mobile-id.html">이전</a>
          <a class="channel-btn" href="./index.html">메인으로</a>
        </div>
      </section>

    </main>
  </div>
</body>
</html>
