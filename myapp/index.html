<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
  <title>정부24 클론</title>
</head>
<body>
  <div class="stage">
    <div class="phone">

      <div class="notice">
        <span class="flag">🇰🇷</span>
        <span class="notice-text">이 누리집은 대한민국 공식 전자정부 누리집입니다.</span>
      </div>

      <header class="topbar">
        <div class="brand">
          <div class="brand-logo">
            <span class="mark"></span>
            <span class="brand-name">정부24</span>
          </div>
        </div>

        <button class="menu" type="button">
          <span class="hamburger"></span>
          <span class="menu-text">전체메뉴</span>
        </button>
      </header>

      <div class="search-wrap">
        <div class="search">
          <input class="search-input" placeholder="정부 서비스를 쉽게 검색하세요." />
          <button class="search-btn" type="button" aria-label="검색">🔍</button>
        </div>
      </div>

      <section class="section">
        <h2 class="section-title">자주 찾는 서비스</h2>

        <div class="quick-grid">
          <a class="quick-item" href="#"><span class="quick-label">인감증명서</span><span class="badge"></span></a>
          <a class="quick-item" href="#"><span class="quick-label">토지(임야)대장</span><span class="badge"></span></a>
          <a class="quick-item" href="#"><span class="quick-label">주민등록등본(초본)</span><span class="badge"></span></a>
          <a class="quick-item" href="#"><span class="quick-label">자동차등록원부</span><span class="badge"></span></a>
          <a class="quick-item" href="#"><span class="quick-label">건축물대장</span><span class="badge"></span></a>
          <a class="quick-item" href="#">
            <span class="quick-label">가족관계증명서</span>
            <span style="display:flex;align-items:center;">
              <span class="badge"></span>
              <span class="ext">↗</span>
            </span>
          </a>
        </div>

        <a class="more" href="#"><span>더보기</span><span class="plus">+</span></a>
      </section>

      <section class="section">
        <h2 class="section-title">지금 봐야 할 혜택/보조금</h2>

        <div class="cards-grid">
          <a class="card card-pink" href="#">
            <img class="card-bg" src="(배경이미지URL)" alt="">
            <div class="card-content">
              <div class="card-title">유아학비</div>
              <div class="card-sub">현금(감면)<br>지급</div>
            </div>
            <div class="card-ico">
              <img src="https://framerusercontent.com/images/F44KGdM5wK0dbICGRiWkWutixI.png?width=160&height=86" alt="">
            </div>
          </a>

          <!-- 나머지 카드도 동일 구조로 -->
        </div>
      </section>

    </div>
  </div>
</body>
</html>
