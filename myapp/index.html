<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>정부24 클론</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
<div class="stage">
<div class="phone">

  <!-- 공지 -->
  <div class="notice">
    <span class="flag">KR</span>
    이 누리집은 대한민국 공식 전자정부 누리집입니다.
  </div>

  <!-- 상단 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <div class="mark"></div>
        <span class="brand-name">정부24</span>
      </div>
    </div>

    <button class="menu">
      <span class="hamburger"></span>
      <span class="menu-text">전체메뉴</span>
    </button>
  </header>

  <!-- 검색 -->
  <div class="search-wrap">
    <div class="search">
      <input class="search-input"
             placeholder="정부 서비스를 쉽게 검색하세요.">
      <button class="search-btn">🔍</button>
    </div>
  </div>

  <!-- 자주 찾는 서비스 -->
  <section class="section">
    <h2 class="section-title">자주 찾는 서비스</h2>

    <div class="quick-grid">
      <a class="quick-item"><span>인감증명서</span><span class="badge"></span></a>
      <a class="quick-item"><span>토지(임야)대장</span><span class="badge"></span></a>
      <a class="quick-item"><span>주민등록등본(초본)</span><span class="badge"></span></a>
      <a class="quick-item"><span>자동차등록원부</span><span class="badge"></span></a>
      <a class="quick-item"><span>건축물대장</span><span class="badge"></span></a>
      <a class="quick-item"><span>가족관계증명서</span><span class="badge"></span></a>
    </div>
  </section>

  <!-- 혜택/보조금 -->
  <section class="section">
    <h2 class="section-title">지금 봐야 할 혜택/보조금</h2>

    <div class="cards-grid">
      <div class="card">
        <div class="card-title">유아학비</div>
        <div class="card-sub">현금(감면)<br>지급</div>
      </div>

      <div class="card">
        <div class="card-title">전세보증금반환보증 보증료</div>
        <div class="card-sub">현금<br>지급</div>
      </div>

      <div class="card">
        <div class="card-title">초중고 입학축하금 지원</div>
        <div class="card-sub">현금 및<br>지역 바우처 제공</div>
      </div>

      <div class="card">
        <div class="card-title">근로장려금</div>
        <div class="card-sub">현금<br>지급</div>
      </div>
    </div>
  </section>

  <!-- ⭐ 하단부 시작 -->
  <section class="section">
    <div class="channel-head">
      <h2 class="section-title">국민소통채널</h2>
      <button class="plus-btn">+</button>
    </div>

    <div class="channel-box">
      <div class="channel-item">MyGov</div>
      <div class="channel-item">주제별 보기</div>
      <div class="channel-item">문서진위확인</div>
      <div class="channel-item">혜택알림</div>
    </div>
  </section>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="footer-text">
      정부민원안내콜센터 110 (국번없이 110, 24시간 운영)
    </div>
  </footer>

</div>
</div>
</body>
</html>
