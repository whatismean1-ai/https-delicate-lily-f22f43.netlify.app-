<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
  <title>정부24 클론</title>
</head>
<body>
  <div class="stage">
    <main class="phone">

      <!-- 상단 알림 -->
      <div class="notice-top">
        <img
          src="./assets/flag_from_second_24x16.png"
          srcset="./assets/flag_from_second_48x32@2x.png 2x"
          width="24"
          height="16"
          alt=""
          aria-hidden="true"
        />
        <p class="notice-msg">이 누리집은 대한민국 공식 전자정부 누리집입니다.</p>
      </div>

      <!-- 헤더 -->
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="./assets/gov24.png" alt="정부24" />
        </div>

        <button class="menu" type="button" aria-label="전체메뉴">
          <span class="hamburger" aria-hidden="true"></span>
          <span class="menu-text">전체메뉴</span>
        </button>
      </header>

      <!-- 공지사항 위 구분선 -->
      <div class="sep-inset" aria-hidden="true"></div>

      <!-- 공지사항 -->
      <a class="notice-link" href="#">
        <img
          class="bell-img"
          src="./assets/bell_yellow_16.png"
          srcset="./assets/bell_yellow_32x32_retina.png 2x"
          width="16"
          height="16"
          alt=""
          aria-hidden="true"
        />
        <span class="notice-link-text">공지사항 확인하기</span>
      </a>

      <!-- 공지사항 아래 구분선 -->
      <div class="notice-divider" aria-hidden="true"></div>

      <!-- 회색 배경 영역 시작 (검색 ~ 자주찾는서비스 ~ AI배너) -->
      <div class="search-area">

        <!-- 검색 -->
        <section class="search-wrap" aria-label="검색">
          <div class="search">
            <input
              class="search-input"
              type="text"
              placeholder="정부 서비스를 쉽게 검색하세요."
            />
            <button class="search-btn" type="button" aria-label="검색">
              <svg class="search-svg" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-4.2-4.2"></path>
              </svg>
            </button>
          </div>
        </section>

        <!-- 자주 찾는 서비스 -->
        <section class="quick-section" aria-label="자주 찾는 서비스">
          <h2 class="section-title">자주 찾는 서비스</h2>

          <!-- ✅ quick-grid는 딱 1번만 -->
          <div class="quick-grid">
            <a class="quick-item" href="#">
              <span class="quick-label">인감증명서</span>
              <img
                class="qi-ico"
                src="./assets/pc_20_set.png"
                srcset="./assets/pc_40_set.png 2x"
                width="20"
                height="20"
                alt=""
                aria-hidden="true"
              />
            </a>

            <a class="quick-item" href="#">
              <span class="quick-label">토지(임야)대장</span>
              <img
                class="qi-ico"
                src="./assets/pdf_20_set.png"
                srcset="./assets/pdf_40_set.png 2x"
                width="20"
                height="20"
                alt=""
                aria-hidden="true"
              />
            </a>

            <a class="quick-item" href="#">
              <span class="quick-label">주민등록등본(초본)</span>
              <img
                class="qi-ico"
                src="./assets/pdf_20_set.png"
                srcset="./assets/pdf_40_set.png 2x"
                width="20"
                height="20"
                alt=""
                aria-hidden="true"
              />
            </a>

            <a class="quick-item" href="#">
              <span class="quick-label">자동차등록원부</span>
              <img
                class="qi-ico"
                src="./assets/pc_20_set.png"
                srcset="./assets/pc_40_set.png 2x"
                width="20"
                height="20"
                alt=""
                aria-hidden="true"
              />
            </a>

            <a class="quick-item" href="#">
              <span class="quick-label">건축물대장</span>
              <img
                class="qi-ico"
                src="./assets/pdf_20_set.png"
                srcset="./assets/pdf_40_set.png 2x"
                width="20"
                height="20"
                alt=""
                aria-hidden="true"
              />
            </a>

            <a class="quick-item" href="#">
              <span class="quick-label">가족관계증명서</span>
              <img
                class="qi-ico qi-ico-sm"
                src="./assets/link_16_set.png"
                srcset="./assets/link_32_set.png 2x"
                width="16"
                height="16"
                alt=""
                aria-hidden="true"
              />
            </a>
          </div>

          <a class="more" href="#">
            <span>더보기</span><span class="plus" aria-hidden="true">+</span>
          </a>
        </section>

        <!-- AI 배너 -->
        <section class="banner" aria-label="AI 배너">
          <div class="banner-card">
            <div class="banner-text">
              <p class="b-title">AI 기반 민원 서비스</p>
              <p class="b-sub">주민등록 · 건강보험 · 각종 혜택</p>
              <p class="b-date">2026년 03월 업데이트</p>
            </div>
            <div class="banner-shape" aria-hidden="true"></div>
          </div>
        </section>

      </div>
      <!-- ✅ 회색 배경 영역 끝 -->

      <!-- 혜택/보조금 -->
      <section class="section">
        <h2 class="section-title">지금 봐야 할 혜택/보조금</h2>
        <div class="cards-grid">
          <a class="card" href="#">
            <div class="card-content">
              <div class="card-title">유아학비</div>
              <div class="card-sub">현금(감면)<br />지급</div>
            </div>
            <div class="card-ico"><span class="emo">🧸</span></div>
            <div class="card-bg bg-pink" aria-hidden="true"></div>
          </a>

          <a class="card" href="#">
            <div class="card-content">
              <div class="card-title">전세보증금반환보증 보증료</div>
              <div class="card-sub">현금<br />지급</div>
            </div>
            <div class="card-ico"><span class="emo">🏠</span></div>
            <div class="card-bg bg-yellow" aria-hidden="true"></div>
          </a>

          <a class="card" href="#">
            <div class="card-content">
              <div class="card-title">초중고 입학축하금 지원</div>
              <div class="card-sub">현금 및<br />지역 바우처 제공</div>
            </div>
            <div class="card-ico"><span class="emo">🧑‍🎓</span></div>
            <div class="card-bg bg-blue" aria-hidden="true"></div>
          </a>

          <a class="card" href="#">
            <div class="card-content">
              <div class="card-title">근로장려금</div>
              <div class="card-sub">현금<br />지급</div>
            </div>
            <div class="card-ico"><span class="emo">🐷</span></div>
            <div class="card-bg bg-blue2" aria-hidden="true"></div>
          </a>
        </div>

        <a class="benefit-more" href="#">
          <span>더 많은 혜택 보기</span>
          <span class="open" aria-hidden="true"></span>
        </a>
      </section>

      <!-- 이후 국민소통채널/푸터/하단메뉴는 네 기존 그대로 -->
      <!-- (여기 아래는 네 코드 유지) -->

    </main>
  </div>
</body>
</html>
