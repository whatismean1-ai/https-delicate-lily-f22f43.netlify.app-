<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
  <title>정부24 클론</title>
</head>
<body>
  <div class="stage">
    <main class="phone">

      <!-- 상단 알림 -->
      <div class="notice-top">
        <!-- 태극기(레티나) -->
        <img class="flag-img" src="./assets/flag_48x32_retina_clean.png" width="24" height="16" alt="" aria-hidden="true">
        <p class="notice-msg">이 누리집은 대한민국 공식 전자정부 누리집입니다.</p>
      </div>

      <!-- 헤더 -->
      <header class="topbar">
        <div class="brand">
          <img class="brand-logo" src="./assets/gov24.png" alt="정부24" />
        </div>

        <button class="menu" type="button" aria-label="전체메뉴">
          <span class="hamburger" aria-hidden="true"></span>
          <span class="menu-text">전체메뉴</span>
        </button>
      </header>

      <!-- 공지사항 위 구분선 -->
      <div class="sep-inset" aria-hidden="true"></div>

      <!-- 공지사항 -->
      <a class="notice-link" href="#">
        <span class="bell" aria-hidden="true">
          <img src="./assets/bell_yellow_32x32_retina.png" width="16" height="16" alt="">
        </span>
        <span class="notice-link-text">공지사항 확인하기</span>
      </a>

      <!-- 검색 -->
      <section class="search-wrap">
        <div class="search">
          <input class="search-input" type="text" placeholder="정부 서비스를 쉽게 검색하세요." />
          <button class="search-btn" type="button" aria-label="검색">
            <!-- 돋보기 SVG -->
            <svg class="ico-search" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-3.2-3.2"></path>
            </svg>
          </button>
        </div>
      </section>

      <!-- 자주 찾는 서비스 -->
      <section class="section section-muted">
        <h2 class="section-title">자주 찾는 서비스</h2>

        <div class="quick-grid">
          <a class="quick-item" href="#"><span class="quick-label">인감증명서</span><img class="qi-ico" src="./assets/pc_40x40_retina_clean.png" width="20" height="20" alt="" aria-hidden="true"></a>
          <a class="quick-item" href="#"><span class="quick-label">토지(임야)대장</span><img class="qi-ico" src="./assets/pdf_40x40_retina_clean.png" width="20" height="20" alt="" aria-hidden="true"></a>
          <a class="quick-item" href="#"><span class="quick-label">주민등록등본(초본)</span><img class="qi-ico" src="./assets/pdf_40x40_retina_clean.png" width="20" height="20" alt="" aria-hidden="true"></a>
          <a class="quick-item" href="#"><span class="quick-label">자동차등록원부</span><img class="qi-ico" src="./assets/pc_40x40_retina_clean.png" width="20" height="20" alt="" aria-hidden="true"></a>
          <a class="quick-item" href="#"><span class="quick-label">건축물대장</span><img class="qi-ico" src="./assets/pdf_40x40_retina_clean.png" width="20" height="20" alt="" aria-hidden="true"></a>
          <a class="quick-item" href="#"><span class="quick-label">가족관계증명서</span><img class="qi-ico qi-ico-sm" src="./assets/link_32x32_retina_clean.png" width="16" height="16" alt="" aria-hidden="true"></a>
        </div>

        <a class="more" href="#"><span>더보기</span><span class="plus" aria-hidden="true">+</span></a>
      </section>

    </main>
  </div>
</body>
</html>
